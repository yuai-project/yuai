name: Link issue

# ブランチ名 `feat/12-story-filter` の `12` を拾って、PR 本文に `Closes #12` を入れる。
# 紐づけておくと、マージで Issue が自動クローズされ、Project のカードも Done に落ちる。
#
# 番号が無いブランチ（`chore/add-skills` など Issue を持たない整備作業）は素通りする。
# 失敗させないのは、番号を強制すると「Issue を立てるのが面倒だから main で直す」に流れるため。

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: ブランチ名の Issue 番号を PR 本文に反映
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          NUM=$(printf '%s' "$HEAD_REF" | sed -nE 's#^[a-z]+/([0-9]+)(-.*)?$#\1#p')
          if [ -z "$NUM" ]; then
            echo "::notice::ブランチ名に Issue 番号がないのでスキップします（head: $HEAD_REF）"
            exit 0
          fi

          # gh pr edit / gh issue view は Projects (classic) 廃止の影響で
          # 一部の gh 版が失敗する。ランナーの版に左右されないよう REST を直接叩く。
          KIND=$(gh api "repos/$REPO/issues/$NUM" --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null) || KIND="none"
          if [ "$KIND" != "issue" ]; then
            echo "::warning::#$NUM は Issue ではありません（$KIND）。本文は変更しません。"
            exit 0
          fi

          # GitHub の本文は CRLF で届くので LF に正規化してから扱う
          BODY_LF=$(printf '%s' "$BODY" | tr -d '\r')

          if printf '%s' "$BODY_LF" | grep -Eiq "(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#${NUM}([^0-9]|$)"; then
            echo "既に Issue #$NUM が紐づいています。何もしません。"
            exit 0
          fi

          if printf '%s' "$BODY_LF" | grep -q '^Closes #[[:space:]]*$'; then
            # PR テンプレートの空欄を埋める
            printf '%s' "$BODY_LF" | sed "s|^Closes #[[:space:]]*$|Closes #${NUM}|" > body.md
          else
            # 欄が消されていたら末尾に足す
            printf '%s\n\nCloses #%s\n' "$BODY_LF" "$NUM" > body.md
          fi

          gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@body.md --silent
          echo "::notice::PR #$PR を Issue #$NUM に紐づけました"
