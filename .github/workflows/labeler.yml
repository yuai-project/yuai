name: PR labeler

# PR に「どの領域か」「どれくらいの規模か」を自動でラベル付けする。
# レビュアーが一覧から拾いやすくなる＝レビュー待ちが減る。

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  area:
    name: 領域ラベル
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size:
    name: 規模ラベル
    runs-on: ubuntu-latest
    steps:
      # 外部アクションを増やしたくないので gh CLI で自前計算する。
      # 行数 = additions + deletions（lock ファイル等も含むのであくまで目安）
      - name: 差分行数からラベルを付け替える
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          total=$(( ADDITIONS + DELETIONS ))
          if   [ "$total" -lt 20 ];   then size="XS"
          elif [ "$total" -lt 100 ];  then size="S"
          elif [ "$total" -lt 300 ];  then size="M"
          elif [ "$total" -lt 800 ];  then size="L"
          else                             size="XL"
          fi
          echo "変更行数 $total → size: $size"

          # 既存の size ラベルを外してから付け直す（付けっぱなし防止）
          for s in XS S M L XL; do
            [ "$s" = "$size" ] && continue
            gh pr edit "$PR" -R "$REPO" --remove-label "size: $s" 2>/dev/null || true
          done
          gh pr edit "$PR" -R "$REPO" --add-label "size: $size"

          if [ "$size" = "XL" ]; then
            echo "::warning::差分が ${total} 行あります。レビューしやすいよう PR を分割できないか検討してください。"
          fi
