name: DEBUG issue event
# 一時的な調査用。原因が分かったら削除する。
on:
  issues:
    types: [labeled]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: 条件を個別に評価
        env:
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ASSOC: ${{ github.event.issue.author_association }}
          COND1: ${{ github.event.label.name == 'memo' }}
          COND2: ${{ github.event.issue.state == 'open' }}
        run: |
          echo "action             = $ACTION"
          echo "label.name         = [$LABEL_NAME]"
          echo "issue.state        = [$ISSUE_STATE]"
          echo "author_association = [$ASSOC]"
          echo "cond1 label==memo  = $COND1"
          echo "cond2 state==open  = $COND2"
      - name: イベントペイロード全体
        env:
          EVENT: ${{ toJSON(github.event) }}
        run: printf '%s\n' "$EVENT" | head -c 2500
